# telemetry.flagward.com — install as /etc/nginx/sites-available/telemetry.flagward.com
# and symlink into sites-enabled, then run:
#   certbot --nginx -d telemetry.flagward.com
# certbot adds the TLS lines to this server block; everything else here is the
# privacy promise in docs/telemetry.md and MUST survive any edit:
#
#   1. The client IP never reaches the app (headers blanked below).
#   2. The client IP is never written to disk (no access log, error log at crit).
#
# Rate and size limits live here because this is the only component that sees
# the client IP. The zone is shared memory, never persisted.

limit_req_zone $binary_remote_addr zone=telemetry_heartbeat:10m rate=10r/m;

# Must match TELEMETRY_PORT in the stack's .env (Nginx does not expand
# environment variables).
upstream telemetry_app {
    server 127.0.0.1:3100;
}

server {
    listen 80;
    listen [::]:80;
    server_name telemetry.flagward.com;

    access_log off;
    # error_log lines carry "client: <ip>"; crit keeps only fatal proxy errors.
    # This also hides limit_req rejections, which are logged at "error".
    error_log /var/log/nginx/telemetry.flagward.com.error.log crit;

    # Blank every header that could carry the client address upstream.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   "";
    proxy_set_header X-Real-IP         "";
    proxy_set_header Forwarded         "";
    proxy_set_header True-Client-IP    "";
    proxy_set_header CF-Connecting-IP  "";

    location = /v1/heartbeat {
        client_max_body_size 16k;
        limit_req zone=telemetry_heartbeat burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://telemetry_app;
    }

    location / {
        client_max_body_size 1k;
        proxy_pass http://telemetry_app;
    }
}
