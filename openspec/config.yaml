project: flagward-telemetry
context: |
  Collector and public stats page for anonymous Flagward installation telemetry,
  served at telemetry.flagward.com. Receives schema v1 heartbeats sent by the
  Flagward backend (basb7/flagward, telemetry/ app, docs/telemetry.md).
  Planned stack: Next.js 16 / React 19 / TypeScript (Biome, Tailwind v4, shadcn),
  PostgreSQL, Docker Compose -- same conventions as flagward-landing.

strict_tdd: true
